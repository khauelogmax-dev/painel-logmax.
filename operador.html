<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LogMax · Operador</title>
<link rel="icon" type="image/png" href="lume-96.png">
<link rel="apple-touch-icon" href="lume.png">
<style>
:root{
  --marinho:#0f1f3d;--marinho2:#1b2f57;--laranja:#c2410c;--laranja-claro:#fff3eb;
  --verde:#15803d;--verde-claro:#dcfce7;--vermelho:#b91c1c;--vermelho-claro:#fee2e2;
  --ambar:#a16207;--ambar-claro:#fef3c7;--tx:#0f172a;--tx2:#475569;--linha:#e2e8f0;--fundo:#f1f5f9;--cartao:#fff;
  --cinza:#e2e8f0;--cinza-tx:#334155;--li:#f8fafc;--mini:#f0fdf4;--luz-bg:#fef9c3;--luz-tx:#854d0e;--sombra:rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--fundo);color:var(--tx);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--marinho);color:#fff}
.topo{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.marca{font-weight:800;font-size:1.25rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}.marca span{color:#fb923c}
.marca img{width:2.75rem;height:2.75rem;border-radius:50%;border:2px solid #fb923c;object-fit:cover}
.dia{display:flex;align-items:center;gap:8px}
.dia button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:18px;cursor:pointer}
.dia button:disabled{opacity:.35;cursor:default}
.dia strong{min-width:150px;text-align:center;font-size:1.06rem}
.hoje-tag{background:var(--laranja);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:2px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes button{font:inherit;font-size:14px;font-weight:700;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;padding:8px 12px;cursor:pointer}
.acoes button[aria-pressed="true"]{background:#fff;color:var(--marinho)}
.status{font-size:13px;color:#cbd5e1;width:100%;text-align:right}
main{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
.filtros{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.filtros span{font-size:14px;font-weight:700;color:var(--tx2);margin-right:2px}
.chip{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--linha);background:var(--cartao);color:var(--tx);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--marinho);border-color:var(--marinho);color:#fff}
.faixa{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.num{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:14px 16px;font:inherit;text-align:left;cursor:pointer;color:inherit;transition:box-shadow .15s,border-color .15s}
.num:hover{border-color:var(--laranja)}
.num.ativo{border:2px solid var(--laranja);box-shadow:0 4px 14px rgba(194,65,12,.18)}
.num .rot{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2)}
.num .val{font-size:2.5rem;font-weight:800;line-height:1.1;margin-top:4px}
.num .de{font-size:1.1rem;font-weight:600;color:var(--tx2)}
.num.principal{background:var(--marinho2);color:#fff;border:0}.num.principal .rot,.num.principal .de{color:#cbd5e1}
.num.principal.ativo{border:2px solid #fb923c}
.toque{margin-top:6px;font-size:13px;font-weight:700;color:var(--laranja)}.num.principal .toque{color:#fdba74}
.semana{margin-top:2px;font-size:14px;font-weight:700;color:var(--vermelho)}
.barra{height:10px;border-radius:999px;background:rgba(148,163,184,.3);overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;background:#4ade80;border-radius:999px}
.verde{color:var(--verde)}.vermelho{color:var(--vermelho)}.ambar{color:var(--ambar)}
h2{font-size:1.12rem;margin:24px 0 10px}
.vazio{background:var(--verde-claro);color:var(--verde);border-radius:12px;padding:14px;font-weight:700}
.etq{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.etq.v{background:var(--verde-claro);color:var(--verde)}.etq.r{background:var(--vermelho-claro);color:var(--vermelho)}
.etq.a{background:var(--ambar-claro);color:var(--ambar)}.etq.c{background:var(--cinza);color:var(--cinza-tx)}
.painel{background:var(--cartao);border:2px solid var(--laranja);border-radius:14px;padding:14px;margin:-6px 0 20px;scroll-margin-top:12px}
.painel-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}.painel-cab h2{margin:0}
.fechar{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--linha);background:var(--cartao);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
.painel-lojas{display:grid;gap:12px;margin-top:12px}
.painel-loja .pl-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lojas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.loja{background:var(--cartao);border:1px solid var(--linha);border-radius:14px}
.loja .nome{font-weight:800;display:flex;justify-content:space-between;gap:8px}
.loja .conta{font-size:1.75rem;font-weight:800;margin-top:4px}.loja .conta small{font-size:.95rem;color:var(--tx2);font-weight:600}
.loja .barra{background:var(--cinza)}.loja .barra i{background:var(--verde)}
.loja .etqs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
details.loja{padding:0;overflow:hidden;border-left-width:6px}
@keyframes piscar{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(250,204,21,.9),0 0 10px 2px rgba(250,204,21,.9)}50%{opacity:.25;box-shadow:0 0 0 6px rgba(250,204,21,0),0 0 0 0 rgba(250,204,21,0)}}
@keyframes brilho{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,0)}50%{box-shadow:0 0 0 4px rgba(250,204,21,.55)}}
.luz-atraso{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;color:var(--luz-tx);background:var(--luz-bg);border-radius:999px;padding:2px 10px 2px 6px;white-space:nowrap}
.luz-atraso i{width:.8rem;height:.8rem;border-radius:50%;background:#facc15;display:inline-block;animation:piscar 1s ease-in-out infinite}
details.loja.com-atraso{animation:brilho 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.luz-atraso i,details.loja.com-atraso{animation:none}}
details.loja.mini>summary{display:flex;align-items:center;gap:10px;padding:12px 14px}
details.loja.mini>summary b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ponto-verde{width:.75rem;height:.75rem;border-radius:50%;background:var(--verde);flex:none}
.mini-conta{font-size:.85rem;font-weight:800;color:var(--verde);background:var(--verde-claro);border-radius:999px;padding:2px 10px;white-space:nowrap}
details.loja.mini{background:var(--mini)}
details.loja.mini[open]{border-color:#86efac;border-left-color:var(--verde)}
.lojas.completas{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
html.tv .lojas.completas{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
details.loja.p1{border-left-color:var(--vermelho)}details.loja.p2{border-left-color:#f59e0b}details.loja.p3{border-left-color:var(--verde)}
details.loja>summary{list-style:none;cursor:pointer;padding:14px;display:block}
details.loja>summary::-webkit-details-marker{display:none}
details.loja[open]{grid-column:1/-1;border-color:var(--laranja);box-shadow:0 4px 14px var(--sombra)}
.abrir{margin-top:10px;font-size:.88rem;font-weight:700;color:var(--laranja)}
details.loja[open] .abrir .seta{display:inline-block;transform:rotate(90deg)}
.lista{display:grid;gap:14px}
details.loja .lista{border-top:1px solid var(--linha);padding:10px 14px 14px}
.lista h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2)}
.lista ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.95rem}
.lista li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--li)}
.lista li.r{background:var(--vermelho-claro)}.lista li.a{background:var(--ambar-claro)}
.lista li span:first-child{min-width:0}
.lista li .dir{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.ok-todos{color:var(--verde);font-weight:700}
.rodape{margin-top:28px;font-size:13px;color:var(--tx2)}
.aviso{background:var(--laranja-claro);border:1px solid var(--linha);border-radius:12px;padding:14px;margin-bottom:16px}
#toasts{position:fixed;left:0;right:0;bottom:16px;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;max-width:560px;width:100%;background:var(--vermelho);color:#fff;font-weight:700;border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.ok{background:var(--verde);font-size:1.15rem;text-align:center;animation:entra .3s ease-out}
@keyframes entra{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
/* ===== Comemoração: tudo fechado ===== */
.festa{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(6,13,28,.88);cursor:pointer;animation:entra .3s ease-out;overflow:hidden}
.festa-texto{position:relative;text-align:center;padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.festa-texto img{width:clamp(90px,14vw,170px);height:clamp(90px,14vw,170px);border-radius:50%;border:5px solid #facc15;object-fit:cover;animation:pula .6s ease-in-out infinite alternate}
.grito{font-size:clamp(40px,8.5vw,128px);font-weight:900;line-height:1.02;letter-spacing:-.01em;color:#facc15;text-shadow:0 0 24px rgba(250,204,21,.55),0 6px 0 #1d4ed8;animation:zoom 1s ease-in-out infinite alternate}
.festa .sub{font-size:clamp(16px,2.4vw,28px);font-weight:800;color:#bbf7d0}
.confete i{position:absolute;top:-24px;width:12px;height:18px;border-radius:3px;animation:cai linear infinite}
@keyframes cai{to{top:110%;transform:rotate(720deg)}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes pula{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.grito,.festa-texto img,.confete i{animation:none}.confete{display:none}}
/* ===== Modo escuro ===== */
html.escuro{
  --marinho:#060d1c;--marinho2:#14284d;--fundo:#0b1322;--cartao:#121c30;--linha:#26344f;--tx:#e8edf5;--tx2:#9aa8bf;
  --verde:#4ade80;--verde-claro:rgba(74,222,128,.16);--vermelho:#f87171;--vermelho-claro:rgba(248,113,113,.16);
  --ambar:#fbbf24;--ambar-claro:rgba(251,191,36,.16);--laranja:#fb923c;--laranja-claro:rgba(251,146,60,.12);
  --cinza:#26344f;--cinza-tx:#cbd5e1;--li:#18233a;--mini:#0f2a1f;--luz-bg:rgba(250,204,21,.18);--luz-tx:#fde047;--sombra:rgba(0,0,0,.45);
  color-scheme:dark}
html.escuro .toast{background:#b91c1c}html.escuro .toast.ok{background:#15803d}
html.escuro .lista li.r{background:var(--vermelho-claro)}html.escuro .lista li.a{background:var(--ambar-claro)}
html.escuro .chip[aria-pressed="true"]{background:var(--laranja);border-color:var(--laranja);color:#0b1322}
html.escuro .loja .barra i{background:#22c55e}
/* ===== Modo TV ===== */
html.tv{font-size:22px}
html.tv .topo,html.tv main{max-width:none;padding-left:32px;padding-right:32px}
html.tv .lojas{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
html.tv .num .rot,html.tv .toque,html.tv .etq,html.tv .lista h3,html.tv .status,html.tv .semana,html.tv .acoes button,html.tv .chip{font-size:.75rem}
html.tv .dia button{width:56px;height:56px;font-size:24px}
html.tv body{cursor:none}html.tv body:hover{cursor:auto}
@media (max-width:720px){
  .faixa{grid-template-columns:1fr 1fr}.num.principal{grid-column:1/-1}
  .num .val{font-size:2rem}.dia strong{min-width:120px;font-size:.95rem}
  .status{text-align:left}
}
/* ===== Operador ===== */
.faixa-teste{background:#facc15;color:#422006;font-weight:800;text-align:center;font-size:13px;padding:4px 12px}
.btn-chegou{font:inherit;font-weight:800;font-size:.95rem;border:0;border-radius:10px;background:var(--laranja);color:#fff;padding:0 16px;min-height:42px;min-width:104px;cursor:pointer;white-space:nowrap}
html.escuro .btn-chegou{color:#0b1322}
.btn-chegou:active{transform:scale(.97)}
.btn-chegou:disabled{opacity:.6;cursor:wait}
.btn-desfazer{font:inherit;background:none;border:0;color:var(--tx2);text-decoration:underline;font-size:.82rem;cursor:pointer;padding:6px 2px}
.lista li{min-height:52px}
.entrada{max-width:380px;margin:12vh auto 0;background:var(--cartao);border:1px solid var(--linha);border-radius:18px;padding:24px;box-shadow:0 10px 30px var(--sombra);text-align:center}
.entrada img{width:84px;height:84px;border-radius:50%;border:3px solid #fb923c;object-fit:cover}
.entrada h1{font-size:1.3rem;margin:10px 0 4px}
.entrada p{color:var(--tx2);margin:0 0 16px}
.entrada input[type=password]{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1px solid var(--linha);background:var(--li);color:var(--tx);font-size:17px;text-align:center}
.entrada label{display:flex;gap:8px;justify-content:center;align-items:center;margin:12px 0;font-size:14px;color:var(--tx2)}
.entrada .btn-entrar{width:100%;font:inherit;font-weight:800;border:0;border-radius:12px;min-height:46px;background:var(--marinho);color:#fff;cursor:pointer}
html.escuro .entrada .btn-entrar{background:var(--laranja);color:#0b1322}
.erro{color:var(--vermelho);font-weight:700;min-height:1.4em;margin-top:10px}
.btn-trocar{font:inherit;font-weight:700;font-size:.85rem;border:1px solid var(--linha);background:var(--cartao);color:var(--tx);border-radius:10px;padding:0 12px;min-height:42px;cursor:pointer}
.btn-codigo{font:inherit;font-weight:800;font-size:.9rem;border:2px dashed var(--vermelho);background:var(--cartao);color:var(--vermelho);border-radius:10px;padding:0 12px;min-height:42px;cursor:pointer;white-space:nowrap}
.janela-fundo{position:fixed;inset:0;z-index:80;background:rgba(6,13,28,.6);display:grid;place-items:center;padding:16px;animation:entra .2s ease-out}
.janela{width:100%;max-width:400px;background:var(--cartao);color:var(--tx);border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.janela h2{margin:0 0 6px;font-size:1.15rem}
.janela-info{margin:0 0 14px;color:var(--tx2);font-size:.92rem;line-height:1.5}
.janela label{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px}
.janela input{width:100%;font:inherit;font-size:1.4rem;font-weight:800;letter-spacing:.06em;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--linha);background:var(--li);color:var(--tx)}
.janela input:focus{outline:none;border-color:var(--laranja)}
.janela-dica{font-size:.8rem;color:var(--tx2);margin:8px 0 0}
.janela-botoes{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.btn-cancelar{font:inherit;font-weight:700;border:1px solid var(--linha);background:var(--cartao);color:var(--tx);border-radius:10px;padding:0 16px;min-height:42px;cursor:pointer}
body.trancado header,body.trancado main{display:none}
@media (max-width:560px){.lista li{flex-wrap:wrap}.btn-chegou{min-width:96px}}
</style>
</head>
<body class="trancado">
<div id="entrada"></div>
<div class="faixa-teste" id="faixaTeste" hidden></div>
<header>
  <div class="topo">
    <div class="marca"><img src="lume.png" alt="Lume, assistente da LogMax"><div>LogMax <span>·</span> Operador</div></div>
    <div class="dia">
      <button id="ant" aria-label="Dia anterior">←</button>
      <strong id="rotuloDia">…</strong>
      <button id="prox" aria-label="Próximo dia">→</button>
    </div>
    <div class="acoes">
      <button type="button" id="btnSom" aria-pressed="false">🔕 Ligar som</button>
      <button type="button" id="btnEscuro" aria-pressed="false">🌙 Modo escuro</button>
      <button type="button" id="btnTv" aria-pressed="false">📺 Modo TV</button>
      <button type="button" id="btnSair">Sair</button>
    </div>
    <div class="status" id="status">Carregando…</div>
  </div>
</header>
<main id="conteudo"><p>Carregando…</p></main>
<div id="toasts" aria-live="assertive"></div>

<script>
/* ===== CONFIGURAÇÃO: endereço do App da Web (Apps Script) da planilha ===== */
const API_PADRAO = "https://script.google.com/macros/s/AKfycbxHMANMPiLYGj1DhRM7aCUolfp8H1AGopQCA4AGThrymMlEC5oJNZqGp6LnBEp0WeaO/exec";
/* Para testar com a cópia da planilha: operador.html?api=ENDERECO_DA_COPIA */
/* =============================================================== */

const ATUALIZAR_MS = 30 * 1000;   // busca de novo a cada 30 segundos
const ALERTA_MIN = 10;            // apita quando o turno começou há 10 min e o motoboy ainda falta chegar
const NOITE_A_PARTIR = 16 * 60;   // turno que começa às 16:00 ou depois = noite; antes = almoço
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

const API = new URLSearchParams(location.search).get("api") || API_PADRAO;
const MODO_TESTE = !!new URLSearchParams(location.search).get("api");
const CHAVE_SENHA = "logmax-op-senha:" + API;
let senha = "";
const gravando = new Map();   // chave -> "chegou" | "desfazer"
const trocas = new Map();     // chave -> { presenca, quando }  (mudança feita aqui, até a planilha confirmar)
const abertas = new Set();
const jaAvisados = new Set();
let primeiraConferencia = true;
let filtro = null;          // quadro do topo aberto
let turno = "todos";        // todos | almoco | noite
let somLigado = false, audio = null;
let linhas = [], atualizadoEm = "", diaAtual = hojeSP(), diasDisponiveis = [];

const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lerGuardado = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

function hojeSP() { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date()); }
function agoraSPmin(dataISO) { // minutos desde 00:00 de dataISO, no horário de SP
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  const hoje = `${g("year")}-${g("month")}-${g("day")}`;
  return (Date.parse(hoje) - Date.parse(dataISO)) / 864e5 * 1440 + (+g("hour") % 24) * 60 + (+g("minute"));
}
function brParaISO(d) { const m = d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; }
function rotulo(iso) { const d = new Date(iso + "T12:00:00"); return `${DIAS[d.getDay()]} ${iso.slice(8)}/${iso.slice(5,7)}`; }
function inicioMin(h) { const m = String(h).match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function semanaDe(iso) {
  const d = new Date(iso + "T12:00:00"), dow = (d.getDay() + 6) % 7;
  const seg = new Date(d.getTime() - dow * 864e5), dom = new Date(seg.getTime() + 6 * 864e5);
  return [seg.toISOString().slice(0, 10), dom.toISOString().slice(0, 10)];
}
const ddmm = iso => `${iso.slice(8)}/${iso.slice(5,7)}`;

function lerCSV(texto) {
  const out = []; let linha = [], campo = "", aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) { if (c === '"' && texto[i+1] === '"') { campo += '"'; i++; } else if (c === '"') aspas = false; else campo += c; }
    else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && texto[i+1] === "\n") i++; linha.push(campo); out.push(linha); linha = []; campo = ""; }
    else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); out.push(linha); }
  return out;
}

// chegou (OK) · falta (falta chegar) · vaga (sem motoca)
const ehOK = p => String(p).trim().toUpperCase() === "OK";
function presencaDe(l) { return trocas.has(l.chave) ? trocas.get(l.chave).presenca : l.presenca; }
function situacao(l) {
  if (l.vaga) return "vaga";
  return ehOK(presencaDe(l)) ? "chegou" : "falta";
}
function podeMarcar(l) { const p = presencaDe(l).trim().toUpperCase(); return p === "" || p === "N/D"; }   // ex.: "FALTOU" só muda na planilha
function noTurno(l) {
  if (turno === "todos") return true;
  const ini = inicioMin(l.horario) ?? 0;
  return turno === "noite" ? ini >= NOITE_A_PARTIR : ini < NOITE_A_PARTIR;
}
function minutosAtraso(l) { // minutos desde o início do turno (só faz sentido para hoje/passado)
  const ini = inicioMin(l.horario);
  return ini === null ? null : agoraSPmin(l.data) - ini;
}

async function carregar() {
  if (!senha) return;
  try {
    const r = await chamar({ acao: "ler" });
    if (r.senha) { sair(r.erro); return; }
    if (!r.ok) throw new Error(r.erro || "erro");
    const tab = lerCSV(r.csv || "");
    atualizadoEm = (tab[1] && tab[1][7]) || "";
    const hoje = hojeSP(), [, domingo] = semanaDe(hoje);
    linhas = tab.slice(1).filter(c => c[0] && brParaISO((c[1] || "").trim()) && (c[4] || "").trim() && +c[6] > 0).map(c => {
      const nome = (c[4] || "").trim(), cod = (c[3] || "").trim();
      return { loja: c[0].trim(), data: brParaISO(c[1].trim()), dataBR: c[1].trim(), horario: (c[2] || "").trim(), codigo: cod, nome,
               presenca: (c[5] || "").trim(), linha: +c[6], chave: c[0].trim() + "|" + c[6],
               vaga: /N[ÃA]O\s+LOCALIZAD/i.test(nome) };          // vaga = "NÃO LOCALIZADO" na coluna NOME
    }).filter(l => l.data >= hoje && l.data <= domingo);          // só de hoje até domingo
    diasDisponiveis = [...new Set(linhas.map(l => l.data))].sort();
    const agoraMs = Date.now();   // a planilha já confirmou? então esquece a troca guardada aqui
    trocas.forEach((t, k) => { const l = linhas.find(x => x.chave === k); if (!l || ehOK(l.presenca) === ehOK(t.presenca) || agoraMs - t.quando > 90000) trocas.delete(k); });
    if (diaAtual < hoje) diaAtual = hoje;
    document.getElementById("status").textContent =
      `Planilha atualizada ${atualizadoEm ? "em " + atualizadoEm : ""} · tela às ${new Date().toLocaleTimeString("pt-BR")}`;
    desenhar();
    conferirAtrasos();
    conferirCompletas();
  } catch (e) {
    document.getElementById("status").textContent = "Não consegui buscar a planilha agora. Tento de novo em 30 s.";
    if (!linhas.length) document.getElementById("conteudo").innerHTML = `<div class="aviso">Não consegui ler a planilha. Confira a internet e se o código novo da planilha foi implantado (Nova versão).</div>`;
  }
}

/* ===== Som e alertas ===== */
function bipe() {
  if (!somLigado || !audio) return;
  const t = audio.currentTime;
  [0, 0.28, 0.56].forEach(d => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "square"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.2);
    o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + 0.22);
  });
}
function pililim() { // três notas subindo, tipo campainha
  if (!somLigado || !audio) return;
  const t = audio.currentTime;
  [[1046.5, 0], [1318.5, 0.12], [1568, 0.24], [2093, 0.36]].forEach(([f, d]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.3, t + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.5);
    o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + 0.55);
  });
}
function avisoCompleta(loja) {
  const el = document.createElement("div");
  el.className = "toast ok"; el.textContent = `✅ ${loja} completa! Todos chegaram.`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 5000);
  pililim();
}
const estadoLoja = new Map(); // loja -> completa? (hoje, todos os turnos)
function conferirCompletas() {
  const hoje = hojeSP();
  const lojas = [...new Set(linhas.filter(l => l.data === hoje).map(l => l.loja))];
  lojas.forEach(nome => {
    const ls = linhas.filter(l => l.data === hoje && l.loja === nome).map(l => situacao(l));
    const completa = ls.length > 0 && ls.every(s => s === "chegou");
    if (estadoLoja.has(nome) && estadoLoja.get(nome) === false && completa) avisoCompleta(nome);
    estadoLoja.set(nome, completa);
  });
  // tudo fechado: todas as lojas do dia completas (só quando ACABOU de fechar com a tela aberta)
  const tudo = lojas.length > 0 && lojas.every(n => estadoLoja.get(n));
  if (tudoFechado === false && tudo) comemorar();
  tudoFechado = tudo;
}
let tudoFechado = null;
function fanfarra() {
  if (!somLigado || !audio) return;
  const t = audio.currentTime;
  const notas = [[523.3, 0, .16], [659.3, .16, .16], [784, .32, .16], [1046.5, .48, .5], [784, .98, .14], [1046.5, 1.12, .9]];
  notas.forEach(([f, d, dur]) => {
    [1, 2].forEach((mult, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = i ? "sine" : "triangle"; o.frequency.value = f * mult;
      const vol = i ? 0.06 : 0.28;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(vol, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + dur);
      o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + dur + 0.05);
    });
  });
}
function comemorar() {
  const cores = ["#fb923c", "#facc15", "#4ade80", "#38bdf8", "#f472b6", "#ffffff"];
  const confete = Array.from({ length: 90 }, (_, i) =>
    `<i style="left:${(i * 37) % 100}%;background:${cores[i % cores.length]};animation-delay:${(i % 15) * 0.12}s;animation-duration:${2.6 + (i % 7) * 0.35}s;transform:rotate(${i * 23}deg)"></i>`).join("");
  const el = document.createElement("div");
  el.className = "festa"; el.setAttribute("role", "alert");
  el.innerHTML = `<div class="confete" aria-hidden="true">${confete}</div>
    <div class="festa-texto"><img src="lume.png" alt=""><div class="grito">BOAAA TIMEEE!<br>VAMO PRA CIMA BOCA!!</div><div class="sub">Todas as lojas de hoje estão completas ✓</div></div>`;
  el.addEventListener("click", () => el.remove());
  document.querySelectorAll("#toasts .toast").forEach(t => t.remove()); // a festa ocupa a tela toda
  document.body.appendChild(el);
  fanfarra();
  setTimeout(() => el.remove(), 9000);
}
function aviso(texto) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = texto;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 12000);
  bipe();
}
function conferirAtrasos() {
  const hoje = hojeSP();
  const novos = linhas.filter(l => l.data === hoje && situacao(l) === "falta").filter(l => {
    const m = minutosAtraso(l);
    return m !== null && m >= ALERTA_MIN && m < 12 * 60;
  }).filter(l => {
    const k = `${l.loja}|${l.data}|${l.horario}|${l.codigo}|${l.nome}`;
    if (jaAvisados.has(k)) return false;
    jaAvisados.add(k); return true;
  });
  if (primeiraConferencia) { // ao abrir a tela: um aviso só, com o total
    primeiraConferencia = false;
    if (novos.length) aviso(`${novos.length} ${novos.length > 1 ? "motoboys ainda não chegaram" : "motoboy ainda não chegou"} e o turno já começou.`);
    return;
  }
  if (novos.length === 1) aviso(`${novos[0].nome} ainda não chegou na ${novos[0].loja} (turno ${novos[0].horario}).`);
  else if (novos.length > 1) aviso(`${novos.length} motoboys ainda não chegaram: ${[...new Set(novos.map(l => l.loja))].join(", ")}.`);
}
function ligarSom(ligar) {

/* ===== Tela ===== */
const ROT = { chegou: ["Chegou", "v"], falta: ["Falta chegar", "a"], vaga: ["Sem motoca", "r"] };
const ORDEM = { falta: 0, vaga: 1, chegou: 2 };
const porHorario = (a, b) => ORDEM[a.s] - ORDEM[b.s] || (inicioMin(a.horario) ?? 0) - (inicioMin(b.horario) ?? 0);
function estaAtrasado(l) { // turno começou há ALERTA_MIN minutos (ou mais) e ainda sem OK
  if (l.s !== "falta" || l.data !== hojeSP()) return false;
  const m = minutosAtraso(l);
  return m !== null && m >= ALERTA_MIN && m < 12 * 60;
}
function pessoa(l) {
  const m = l.s === "falta" ? minutosAtraso(l) : null;
  const atraso = m !== null && m >= ALERTA_MIN && m < 12 * 60 ? `<span class="etq r">atrasado ${m >= 60 ? Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") : m + " min"}</span>` : "";
  return `<li class="${l.s === "vaga" ? "r" : l.s === "falta" ? "a" : ""}"><span><b>${esc(l.vaga ? "Vaga sem motoca" : l.nome)}</b>${l.codigo && l.codigo !== "0" ? " #" + esc(l.codigo) : ""} · ${esc(l.horario)}</span><span class="dir">${atraso} ${botao(l)}</span></li>`;
}

function botao(l) {
  const g = gravando.get(l.chave), k = esc(l.chave);
  if (l.s === "vaga") return `<button type="button" class="btn-codigo" data-acao="codigo" data-chave="${k}">+ Colocar motoboy</button>`;
  if (l.s === "chegou") return g ? `<button type="button" class="btn-chegou" disabled>Desfazendo…</button>`
    : `<span class="etq v">✓ Chegou</span><button type="button" class="btn-desfazer" data-acao="desfazer" data-chave="${k}">Desfazer</button>`;
  if (!podeMarcar(l)) return `<span class="etq c" title="Para mudar, edite direto na planilha">${esc(presencaDe(l))}</span>`;
  return `${g ? "" : `<button type="button" class="btn-trocar" data-acao="codigo" data-chave="${k}">Trocar</button>`}<button type="button" class="btn-chegou" data-acao="chegou" data-chave="${k}" ${g ? "disabled" : ""}>${g ? "Gravando…" : "Chegou"}</button>`;
}

function cartaoLoja(l) {
      const faltando = l.ls.filter(x => x.s === "falta").sort(porHorario);
      const atrasados = l.atrasados;
      const vagasL = l.ls.filter(x => x.s === "vaga").sort(porHorario);

        <summary>
          <div class="nome"><span>${esc(l.nome)}</span>${atrasados ? `<span class="luz-atraso" title="${atrasados} ${atrasados > 1 ? "motoboys atrasados" : "motoboy atrasado"}"><i aria-hidden="true"></i>${atrasados} ${atrasados > 1 ? "atrasados" : "atrasado"}</span>` : ""}</div>

          ${chegaram.length ? `<div><h3>Já chegaram (${chegaram.length})</h3><ul>${chegaram.map(pessoa).join("")}</ul></div>` : ""}
        </div>
      </details>`;
}
function cartaoCompleto(l) {
  const chegaram = l.ls.filter(x => x.s === "chegou").sort(porHorario);
  return `
      <details class="loja p3 mini" data-loja="${esc(l.nome)}" ${abertas.has(l.nome) ? "open" : ""}>
        <summary><span class="ponto-verde" aria-hidden="true"></span><b>${esc(l.nome)}</b><span class="mini-conta">✓ ${l.chegou}/${l.total}</span></summary>

function desenhar() {
  const hoje = hojeSP();
  document.getElementById("rotuloDia").innerHTML = esc(rotulo(diaAtual)) + (diaAtual === hoje ? '<span class="hoje-tag">HOJE</span>' : "");
  document.getElementById("ant").disabled = !diasDisponiveis.some(d => d < diaAtual && d >= hoje);
  document.getElementById("prox").disabled = !diasDisponiveis.some(d => d > diaAtual);

  const doDia = linhas.filter(l => l.data === diaAtual && noTurno(l)).map(l => ({ ...l, s: situacao(l) }));
  const pessoas = doDia; // total = todas as vagas da escala do dia (inclusive as sem motoca)
  const n = s => doDia.filter(l => l.s === s).length;
  const chegou = n("chegou"), falta = n("falta"), vagas = n("vaga");
  const pct = pessoas.length ? Math.round(chegou / pessoas.length * 100) : 0;
  const seg = hoje, dom = semanaDe(hoje)[1];                       // de hoje até domingo
  const vagasSemana = linhas.filter(l => l.vaga && l.data >= seg && l.data <= dom && noTurno(l));

  const lojas = [...new Set(doDia.map(l => l.loja))].sort((a, b) => a.localeCompare(b));
  const porLoja = lojas.map(nome => {
    const ls = doDia.filter(l => l.loja === nome);
    const c = s => ls.filter(l => l.s === s).length;
    return { nome, ls, total: ls.length, chegou: c("chegou"), falta: c("falta"), vagas: c("vaga"),
             atrasados: ls.filter(estaAtrasado).length };
  })
  // ordem de importância: 1º mais vagas sem motoca, 2º gente para chegar (com atraso primeiro), por último as completas
  .sort((a, b) => b.vagas - a.vagas || (b.falta > 0) - (a.falta > 0) || b.atrasados - a.atrasados || b.falta - a.falta || a.nome.localeCompare(b.nome));
  const completas = porLoja.filter(l => !l.vagas && !l.falta && l.total);

  const btn = (f, extra, conteudo) => `<button type="button" class="num ${extra} ${filtro === f ? "ativo" : ""}" data-f="${f}" aria-pressed="${filtro === f}">${conteudo}</button>`;
  const chipTurno = (v, t) => `<button type="button" class="chip" data-turno="${v}" aria-pressed="${turno === v}">${t}</button>`;

  document.getElementById("conteudo").innerHTML = `

    </div>

    <section class="faixa" aria-label="Resumo do dia. Toque num quadro para ver a lista">
      ${btn("chegou", "principal", `<div class="rot">Chegaram</div><div class="val">${chegou} <span class="de">de ${pessoas.length}</span></div><div class="barra" aria-hidden="true"><i style="width:${pct}%"></i></div><div class="toque">ver quem chegou ›</div>`)}
      ${btn("falta", "", `<div class="rot">Falta chegar</div><div class="val ambar">${falta}</div><div class="toque">ver quem ›</div>`)}
      ${btn("lojas", "", `<div class="rot">Lojas no dia</div><div class="val">${lojas.length}</div><div class="toque">ver lojas ›</div>`)}
      ${btn("vaga", "", `<div class="rot">Vagas sem motoca</div><div class="val vermelho">${vagas}</div><div class="semana">${vagasSemana.length} até domingo</div><div class="toque">ver onde ›</div>`)}
    </section>

    ${pendentes.length ? `<div class="lojas">${pendentes.map(cartaoLoja).join("")}</div>` : `<div class="vazio">Todas as lojas do dia estão completas.</div>`}
    ${completas.length ? `<h2>Completas (${completas.length})</h2><div class="lojas completas">${completas.map(cartaoCompleto).join("")}</div>` : ""}`}

    <p class="rodape">Tela do operador: abra a loja e toque em <b>Chegou</b> para gravar OK na planilha (ou <b>Desfazer</b> para voltar a N/D). OK na coluna PRESENÇA = chegou. Sem OK = falta chegar. "NÃO LOCALIZADO" no nome = vaga sem motoca. Mostra de hoje até domingo. Com o som ligado, a tela apita quando o turno começou há ${ALERTA_MIN} min e o motoboy ainda não chegou, e toca um pililim quando uma loja fica completa. Atualiza sozinha a cada 30 segundos.</p>`;
}

const TITULO = { falta: "Quem falta chegar", chegou: "Quem já chegou", vaga: "Onde estão as vagas sem motoca" };
function painelFiltro(doDia, f) {

  </section>`;
}
function painelVagasSemana(ls, seg, dom) {
  const dias = [...new Set(ls.map(l => l.data))].sort();
  return `<section class="painel">
    <div class="painel-cab"><h2>Vagas sem motoca de hoje até domingo (${ls.length})</h2><span class="etq r">${ddmm(seg)} a ${ddmm(dom)}</span></div>
    ${ls.length === 0 ? `<div class="vazio" style="margin-top:12px">Nenhuma vaga até domingo. Escala completa.</div>` :
      `<div class="painel-lojas">${dias.map(d => {
        const doDia = ls.filter(l => l.data === d);
        const lojas = [...new Set(doDia.map(l => l.loja))].sort((a, b) => a.localeCompare(b));
        return `<div class="painel-loja"><div class="pl-cab"><b>${esc(rotulo(d))}</b><span class="etq r">${doDia.length} ${doDia.length > 1 ? "vagas" : "vaga"}</span></div>
          <div class="lista"><ul>${lojas.map(n => { const v = doDia.filter(l => l.loja === n);
            return `<li class="r"><span><b>${esc(n)}</b> · ${v.map(x => esc(x.horario)).join(", ")}</span><span class="etq r">${v.length}</span></li>`; }).join("")}</ul></div></div>`;
      }).join("")}</div>`}
  </section>`;
}

/* ===== Gravar na planilha ===== */
async function chamar(dados) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ senha }, dados)) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function toast(texto, ok) {
  const t = document.createElement("div");
  t.className = "toast" + (ok ? " ok" : ""); t.textContent = texto;
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), ok ? 2500 : 6000);
}
async function marcar(chave, acao) {
  const l = linhas.find(x => x.chave === chave);
  if (!l || gravando.has(chave)) return;
  if (acao === "codigo") { abrirCodigo(l); return; }
  if (acao === "desfazer" && !confirm(`Tirar o OK de ${l.nome} (${l.loja})?`)) return;
  gravando.set(chave, acao); desenhar();
  try {
    const r = await chamar({ acao, loja: l.loja, linha: l.linha, data: l.dataBR, nome: l.nome });
    if (r.senha) { gravando.delete(chave); sair(r.erro); return; }
    if (r.ok) {
      trocas.set(chave, { presenca: r.presenca || (acao === "chegou" ? "OK" : "N/D"), quando: Date.now() });
      if (acao === "chegou") toast(`✓ ${l.nome} chegou · ${l.loja}`, true);
      else toast(`OK tirado de ${l.nome}`, true);
    } else {
      toast(r.erro || "Não gravou. Tente de novo.");
      if (r.mudou) setTimeout(carregar, 300);
    }
  } catch (e) {
    toast("Não gravou. Confira a internet e tente de novo.");
  } finally {
    gravando.delete(chave); desenhar(); conferirCompletas();
  }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-acao]");
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  marcar(b.dataset.chave, b.dataset.acao);
}, true);

/* ===== Colocar ou trocar motoboy pelo código ===== */
function abrirCodigo(l) {
  const vaga = l.vaga;
  const el = document.createElement("div");
  el.className = "janela-fundo";
  el.innerHTML = `
    <form class="janela" role="dialog" aria-modal="true" aria-labelledby="tituloJanela">
      <h2 id="tituloJanela">${vaga ? "Colocar motoboy na vaga" : "Trocar motoboy"}</h2>
      <p class="janela-info"><b>${esc(l.loja)}</b> · ${esc(rotulo(l.data))} · ${esc(l.horario)}<br>
        ${vaga ? "Hoje: <b>vaga sem motoca</b>" : `Hoje: <b>${esc(l.nome)}</b>${l.codigo ? " #" + esc(l.codigo) : ""}`}</p>
      <label for="campoCodigo">Código do motoboy</label>
      <input id="campoCodigo" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Ex.: 123" required>
      <p class="janela-dica">O nome aparece sozinho pela planilha. A presença (OK) continua separada.</p>
      <div class="erro" id="erroCodigo"></div>
      <div class="janela-botoes">
        <button type="button" class="btn-cancelar" id="btnCancelar">Cancelar</button>
        <button class="btn-chegou" id="btnSalvarCodigo">Salvar</button>
      </div>
    </form>`;
  document.body.appendChild(el);
  const campo = el.querySelector("#campoCodigo"), btnS = el.querySelector("#btnSalvarCodigo");
  const fechar = () => el.remove();
  campo.focus();
  el.querySelector("#btnCancelar").onclick = fechar;
  el.addEventListener("click", e => { if (e.target === el) fechar(); });
  el.addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });
  el.querySelector("form").onsubmit = async ev => {
    ev.preventDefault();
    const codigo = campo.value.trim();
    if (!codigo) return;
    btnS.disabled = true; btnS.textContent = "Gravando…";
    el.querySelector("#erroCodigo").textContent = "";
    try {
      const r = await chamar({ acao: "codigo", loja: l.loja, linha: l.linha, data: l.dataBR, nome: l.nome, codigo });
      if (r.senha) { fechar(); sair(r.erro); return; }
      if (r.ok) {
        fechar();
        toast(`✓ ${r.nome}${r.codigo ? " #" + r.codigo : ""} agora na ${l.loja} · ${l.horario}`, true);
        l.nome = r.nome; l.codigo = r.codigo; l.vaga = /N[ÃA]O\s+LOCALIZAD/i.test(r.nome);
        trocas.delete(l.chave);
        desenhar(); carregar();
      } else {
        el.querySelector("#erroCodigo").textContent = r.erro || "Não gravou. Tente de novo.";
        btnS.disabled = false; btnS.textContent = "Salvar";
        if (r.mudou) setTimeout(() => { fechar(); carregar(); }, 2500);
      }
    } catch (e) {
      el.querySelector("#erroCodigo").textContent = "Não gravou. Confira a internet e tente de novo.";
      btnS.disabled = false; btnS.textContent = "Salvar";
    }
  };
}

/* ===== Entrada com senha ===== */
let iniciado = false;
function telaEntrada(erro) {
  document.body.classList.add("trancado");
  document.getElementById("entrada").innerHTML = `
    <form class="entrada" id="formEntrada">
      <img src="lume.png" alt="Lume, assistente da LogMax">
      <h1>LogMax · Operador</h1>
      <p>Área dos operadores: marcar chegada</p>
      <input type="password" id="campoSenha" placeholder="Senha" autocomplete="current-password" required>
      <label><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
      <button class="btn-entrar" id="btnEntrar">Entrar</button>
      <div class="erro" id="erroEntrada">${esc(erro || "")}</div>
      ${MODO_TESTE ? '<p style="margin-top:12px;font-weight:700;color:var(--ambar)">Modo teste: usando outro endereço de planilha</p>' : ""}
    </form>`;
  const campo = document.getElementById("campoSenha");
  campo.focus();
  document.getElementById("formEntrada").onsubmit = async ev => {
    ev.preventDefault();
    const btnE = document.getElementById("btnEntrar");
    btnE.disabled = true; btnE.textContent = "Conferindo…";
    senha = campo.value;
    try {
      const r = await chamar({ acao: "entrar" });
      if (!r.ok) { document.getElementById("erroEntrada").textContent = r.erro || "Não deu certo."; btnE.disabled = false; btnE.textContent = "Entrar"; return; }
      guardar(CHAVE_SENHA, document.getElementById("lembrar").checked ? senha : "");
      liberar(r.planilha);
    } catch (e) {
      document.getElementById("erroEntrada").textContent = "Não consegui falar com a planilha. Confira a internet.";
      btnE.disabled = false; btnE.textContent = "Entrar";
    }
  };
}
function liberar(nomePlanilha) {
  document.getElementById("entrada").innerHTML = "";
  document.body.classList.remove("trancado");
  const ft = document.getElementById("faixaTeste");
  if (MODO_TESTE || /c[óo]pia|teste/i.test(nomePlanilha || "")) { ft.hidden = false; ft.textContent = "MODO TESTE · " + (nomePlanilha || "planilha de teste"); }
  carregar();
  if (!iniciado) {
    iniciado = true;
    setInterval(carregar, ATUALIZAR_MS);
    setInterval(() => { if (linhas.length && senha) { desenhar(); conferirAtrasos(); } }, 60 * 1000);
  }
}
function sair(erro) {
  senha = ""; guardar(CHAVE_SENHA, "");
  telaEntrada(erro);
}

/* ===== Cliques ===== */
document.getElementById("btnSair").onclick = () => sair();
document.getElementById("ant").onclick = () => { const d = diasDisponiveis.filter(x => x < diaAtual).pop(); if (d) { diaAtual = d; desenhar(); } };
document.getElementById("prox").onclick = () => { const d = diasDisponiveis.find(x => x > diaAtual); if (d) { diaAtual = d; desenhar(); } };
document.getElementById("btnSom").onclick = () => { ligarSom(!somLigado); if (somLigado) bipe(); };
document.getElementById("btnEscuro").onclick = () => modoEscuro(!document.documentElement.classList.contains("escuro"));
document.getElementById("btnTv").onclick = () => modoTv(!document.documentElement.classList.contains("tv"));
document.addEventListener("click", e => {
  if (somLigado && audio && audio.state === "suspended") audio.resume();
  const t = e.target.closest("[data-turno]");
  if (t) { turno = t.dataset.turno; guardar("logmax-turno", turno); desenhar(); return; }
  const b = e.target.closest("[data-f]");
  if (!b) return;
  if (b.dataset.f === "lojas") { filtro = null; desenhar(); document.getElementById("todas-lojas")?.scrollIntoView({ behavior: "smooth" }); return; }
  filtro = filtro === b.dataset.f ? null : b.dataset.f;
  desenhar();
  if (filtro) document.getElementById("painel")?.scrollIntoView({ behavior: "smooth", block: "start" });
});
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.matches && d.matches("details.loja")) d.open ? abertas.add(d.dataset.loja) : abertas.delete(d.dataset.loja);
}, true);

/* ===== Início ===== */
{ const e = new URLSearchParams(location.search).get("escuro"); if (e === "1" || (e !== "0" && lerGuardado("logmax-escuro") === "1")) modoEscuro(true); }
turno = ["todos", "almoco", "noite"].includes(lerGuardado("logmax-turno")) ? lerGuardado("logmax-turno") : "todos";
if (new URLSearchParams(location.search).get("tv") === "1" || lerGuardado("logmax-tv") === "1") {
  document.documentElement.classList.add("tv");
  document.getElementById("btnTv").setAttribute("aria-pressed", "true");
  document.getElementById("btnTv").textContent = "✕ Sair do modo TV";
}
if (lerGuardado("logmax-som") === "1") { // o navegador só deixa tocar depois do primeiro toque na tela
  document.getElementById("btnSom").textContent = "🔔 Toque para ativar o som";
  document.addEventListener("click", function primeiro(e) {
    document.removeEventListener("click", primeiro, true);
    if (!e.target.closest("#btnSom")) ligarSom(true);
  }, true);
}
senha = lerGuardado(CHAVE_SENHA) || "";
if (senha) {
  chamar({ acao: "entrar" }).then(r => r.ok ? liberar(r.planilha) : sair(r.erro))
    .catch(() => telaEntrada("Não consegui falar com a planilha. Confira a internet."));
} else {
  telaEntrada();
}
</script>
